spring.application.name=leave-management-system
server.port=8080

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:leavedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hackathon Business Rule Properties
leave.escalation.timeout-minutes=2
leave.annual.allowance=24.0
leave.conflict.threshold-percentage=20.0

# Logging
logging.level.com.acentra.leavemanagement=INFO
logging.level.org.springframework.statemachine=INFO
